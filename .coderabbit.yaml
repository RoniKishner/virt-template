# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit Configuration
# Full reference: https://docs.coderabbit.ai/reference/configuration

tone_instructions: >-
  Act as a senior KubeVirt operator engineer: professional, constructive
  feedback only. Serious about CRD API compatibility, template substitution
  correctness, generated-code hygiene, and test coverage. Flag issues with
  file/line refs. End positively.

reviews:
  high_level_summary: false
  auto_title_placeholder: ""
  review_status: false
  commit_status: false
  changed_files_summary: false
  sequence_diagrams: false
  suggested_labels: false
  suggested_reviewers: false
  in_progress_fortune: false
  path_filters:
    - "!**/vendor/**"
    - "!**/zz_generated.*"
    - "!**/_out/**"
    - "!**/bin/**"
    - "!cover.out"
  path_instructions:
    - path: "**/*.go"
      instructions: >-
        Flag manual edits to generated files (zz_generated.*.go, DeepCopy,
        OpenAPI, typed client code) - require `make generate`/`make
        manifests`/`make vendor` instead.
    - path: "api/core/**/*.go"
      instructions: >-
        Flag breaking changes to VirtualMachineTemplate/
        VirtualMachineTemplateRequest fields, missing kubebuilder
        validation markers or godoc comments, and CRD changes not followed
        by `make generate`/`make manifests`.
    - path: "staging/src/kubevirt.io/virt-template-engine/template/**"
      instructions: >-
        Verify correct handling of both `${PARAM}` and `${{PARAM}}`
        substitution syntaxes and that the generate/strip-namespace/
        substitute/validate processing order is preserved.
    - path: "internal/controller/**/*.go"
      instructions: >-
        Check Progressing/Ready condition semantics, requeue handling, and
        that the SnapshotCleanup finalizer and deterministic child-object
        naming are preserved.
    - path: "internal/webhook/**/*.go"
      instructions: >-
        Verify immutability rules (e.g. VirtualMachineTemplateRequest
        spec) and parameter placeholder validation are preserved.
    - path: "internal/apiserver/**/*.go"
      instructions: >-
        Check RBAC, error handling, and that the dummy parent REST storage
        / APIResourceList filtering behavior is not broken.
    - path: "config/**"
      instructions: >-
        Flag direct hand-edits to CRDs/RBAC/webhooks that should instead
        come from `make manifests`.
    - path: "**/*_test.go"
      instructions: >-
        Verify controller tests use random per-test namespaces and fake
        clients register WithStatusSubresource where needed.
    - path: "tests/**"
      instructions: >-
        Confirm Eventually blocks use appropriate timeouts and that tests
        correctly skip when KUBECONFIG is unset.
  slop_detection:
    enabled: false
  auto_review:
    auto_pause_after_reviewed_commits: 10
    ignore_title_keywords:
      - "WIP"
    labels:
      - "!do-not-merge/work-in-progress"
    ignore_usernames:
      - "kubevirt-bot"
      - "renovate[bot]"
      - "dependabot[bot]"
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: "off"
    description:
      mode: "off"
    issue_assessment:
      mode: "off"

chat:
  integrations:
    jira:
      usage: disabled
    linear:
      usage: disabled

knowledge_base:
  code_guidelines:
    enabled: true
  learnings:
    scope: global
  issues:
    scope: global
  jira:
    usage: disabled
  linear:
    usage: disabled
  pull_requests:
    scope: global
  mcp:
    usage: disabled
  linked_repositories:
    - repository: "kubevirt/kubevirt"
      instructions: >-
        Core virtualization platform. virt-template processes
        VirtualMachineTemplate CRs into KubeVirt VirtualMachine objects.
        Use to verify VirtualMachine/VirtualMachineInstance API fields,
        instance types/preferences, and DataVolume-related VM spec
        behavior.
    - repository: "kubevirt/virt-template-api"
      instructions: >-
        Published mirror of this repo's ./api module (public API types).
        Cross-reference for the canonical
        VirtualMachineTemplate/VirtualMachineTemplateRequest type
        definitions.
    - repository: "kubevirt/virt-template-client-go"
      instructions: >-
        Published mirror of this repo's
        staging/src/kubevirt.io/virt-template-client-go module (generated
        typed client). Verify generated client changes stay in sync with
        API type changes.
    - repository: "kubevirt/virt-template-engine"
      instructions: >-
        Published mirror of this repo's
        staging/src/kubevirt.io/virt-template-engine module (parameter
        substitution/generation engine). Use for template-processing
        semantics.
    - repository: "kubevirt/enhancements"
      instructions: >-
        Contains VEP design documents. When a PR references a VEP number,
        locate the corresponding vep.md and verify the implementation
        aligns with the stated API shape, phasing plan, and non-goals.

issue_enrichment:
  planning:
    enabled: false
    auto_planning:
      enabled: false
